    <ellipse cx="172" cy="324" rx="50" ry="38" transform="rotate(-22 172 324)" stroke="none"/>
    <ellipse cx="354" cy="292" rx="50" ry="38" transform="rotate(-22 354 292)" stroke="none"/>
  </g>
  <g>
    <circle cx="150" cy="424" r="22" fill="#4b2e5a"/>
    <circle cx="220" cy="424" r="22" fill="#4b2e5a"/>
    <circle cx="290" cy="424" r="22" fill="#4b2e5a"/>
