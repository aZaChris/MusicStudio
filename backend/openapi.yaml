components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          default: ''
          maxLength: 128
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
        accept_terms:
          type: boolean
        consent:
          type: boolean
          default: false
      required:
      - accept_terms
      - token
    Accepted:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AcceptedResponse:
      type: object
      description: Uniform answer of the anonymous account endpoints (no account enumeration).
      properties:
        detail:
          type: string
      required:
      - detail
    ActionEnum:
      enum:
      - registration
      - email.confirm
      - login.success
      - login.failure
      - login.locked
      - password.reset
      - password.change
      - mfa.enable
      - mfa.disable
      - mfa.recovery_used
      - mfa.reset_by_operator
      - account.unlock_by_operator
      - invitation.send
      - invitation.accept
      - invitation.revoke
      - role.change
      - consent.give
      - consent.withdraw
      - privacy.export
      - privacy.erase
      - payment.record
      type: string
      description: |-
        * `registration` - Registration
        * `email.confirm` - Email Confirm
        * `login.success` - Login Success
        * `login.failure` - Login Failure
        * `login.locked` - Login Locked
        * `password.reset` - Password Reset
        * `password.change` - Password Change
        * `mfa.enable` - Mfa Enable
        * `mfa.disable` - Mfa Disable
        * `mfa.recovery_used` - Mfa Recovery Used
        * `mfa.reset_by_operator` - Mfa Reset By Operator
        * `account.unlock_by_operator` - Account Unlock By Operator
        * `invitation.send` - Invitation Send
        * `invitation.accept` - Invitation Accept
        * `invitation.revoke` - Invitation Revoke
        * `role.change` - Role Change
        * `consent.give` - Consent Give
        * `consent.withdraw` - Consent Withdraw
        * `privacy.export` - Privacy Export
        * `privacy.erase` - Privacy Erase
        * `payment.record` - Payment Record
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        actor_email:
          type: string
          nullable: true
          readOnly: true
        target_type:
          type: string
          maxLength: 40
        target_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        metadata: {}
      required:
      - action
      - actor_email
      - created_at
      - id
    Checkout:
      type: object
      description: 'Response of POST /packages/{id}/checkout/: where to send the payer.'
      properties:
        checkout_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - checkout_id
      - expires_at
      - url
    Consent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notice_version:
          type: string
          maxLength: 20
        given_at:
          type: string
