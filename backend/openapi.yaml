    UidTokenRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - token
      - uid
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
          description: Machine-readable reason (e.g. 409).
      required:
      - detail
    ValidationError:
      description: Field name → list of messages, or a list of non-field messages.
      oneOf:
      - type: object
        additionalProperties:
          type: array
          items: {}
      - type: array
        items:
          type: string
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
