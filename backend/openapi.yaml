openapi: 3.0.3
info:
  title: MusicStudio API
  version: 1.0.0
  description: REST API for the MusicStudio teacher/parent platform.
paths:
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: Who did what in the owner's studio, newest first.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - account.unlock_by_operator
          - consent.give
          - consent.withdraw
          - email.confirm
          - invitation.accept
          - invitation.revoke
          - invitation.send
          - login.failure
          - login.locked
          - login.success
          - mfa.disable
          - mfa.enable
          - mfa.recovery_used
          - mfa.reset_by_operator
          - password.change
          - password.reset
          - payment.record
          - privacy.erase
          - privacy.export
          - registration
          - role.change
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO 8601 date-time
      - in: query
        name: until
        schema:
          type: string
        description: ISO 8601 date-time
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role or object not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded; see Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
