# Production stack for Coolify ("Docker Compose" build pack). See ADR-003 and ADR-005.
#
# - No `ports:` anywhere: Coolify's proxy routes the domain you set on the `backend`
#   service (e.g. https://api.example.com:8000 — the suffix is the container port, which
#   must match PORT). A published host port would bypass the proxy.
# - SERVICE_USER_* / SERVICE_PASSWORD_* are generated and persisted by Coolify.
# - `${VAR:?}` marks a variable as required: Coolify blocks the deploy until it is set.
# - Every service has a healthcheck.
# - YAML anchors are avoided on purpose (Coolify's compose parser has had issues with
#   them), so the backend environment is repeated for worker and beat.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicstudio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    command: ["web"]
    environment:
      PORT: ${PORT:-8000}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_ALLOWED_IPS: ${STRIPE_WEBHOOK_ALLOWED_IPS:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-}
      # Coolify's Traefik is the only proxy appending to X-Forwarded-For (ADR-021).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
    expose:
      - "${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "http", "/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["worker"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ./backend
      target: runtime
    command: ["beat"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "beat", "/tmp/celerybeat-schedule", "1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    # Scheduled pg_dump with rotation (ADR-005). Dumps land in the db-backups volume:
    # /backups/{daily,weekly,monthly}/. Off-site copy is a phase 4 task.
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-musicstudio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  redis-data:
  db-backups:
