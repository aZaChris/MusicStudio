# Production stack for Coolify ("Docker Compose" build pack). See ADR-003.
#
# Database backups are NOT in this file: the server's operator runs them (ADR-026). The
# stack's own backup services live in the optional docker-compose.backup.yml overlay.
#
# - No `ports:` anywhere: Coolify's proxy routes the domain you set on the `backend`
#   service (e.g. https://api.example.com:8000 — the suffix is the container port, which
#   must match PORT). A published host port would bypass the proxy.
# - SERVICE_USER_* / SERVICE_PASSWORD_* are generated and persisted by Coolify.
# - `${VAR:?}` marks a variable as required: Coolify blocks the deploy until it is set.
# - Every service has a healthcheck and a memory limit (the server is shared: one runaway
#   container must not starve the other apps). Override with <SERVICE>_MEM_LIMIT.
# - YAML anchors are avoided on purpose (Coolify's compose parser has had issues with
#   them), so the backend environment is repeated for worker and beat.

services:
  db:
    # Pinned to the minor the suite was run against (docs/operations/postgresql-16-vs-18.md).
    # Bump it on purpose, after reading the minor's release notes; do not let it float.
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicstudio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Below its mem_limit; noeviction: never drop queued tasks, refuse writes instead
    # (throttles fail open when Redis refuses, apps/common/throttling.py).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    command: ["web"]
    environment:
      PORT: ${PORT:-8000}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
      # Only the web portal may call the API from a browser (ADR-025).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${SERVICE_URL_WEB_8080}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVICE_URL_WEB_8080}}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_ALLOWED_IPS: ${STRIPE_WEBHOOK_ALLOWED_IPS:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-}
      # Coolify's Traefik is the only proxy appending to X-Forwarded-For (ADR-021).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
    expose:
      - "${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "http", "/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["worker"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVICE_URL_WEB_8080}}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ./backend
      target: runtime
    command: ["beat"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_PASSWORD_64_DJANGOSECRET}
      JWT_SIGNING_KEY: ${SERVICE_PASSWORD_64_JWTKEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${SERVICE_FQDN_BACKEND_8000}}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${SERVICE_URL_BACKEND_8000}}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-musicstudio}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVICE_URL_WEB_8080}}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: ${BEAT_MEM_LIMIT:-192m}
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "beat", "/tmp/celerybeat-schedule", "1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    # The React portal (ADR-025): static files behind a non-root nginx on port 8080.
    # No `ports:`: set the domain of this service in Coolify with the container port as
    # suffix (e.g. https://app.example.com:8080) and Coolify's proxy routes it.
    build:
      context: ./frontend
      target: prod
      args:
        # Baked into the bundle: changing the API address means rebuilding the portal.
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?}/api/v1
        # Optional: link to the Android app (an EAS build). Empty = the landing says it is coming.
        VITE_ANDROID_APK_URL: ${ANDROID_APK_URL:-}
    environment:
      # The only extra origin the browser may connect to (Content-Security-Policy).
      API_ORIGIN: ${API_PUBLIC_URL:?}
    expose:
      - "8080"
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  redis-data:
