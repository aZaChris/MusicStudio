<!doctype html>

     cd frontend && node ../scripts/render-png.mjs ../.github/assets/social-preview.html ../.github/assets/social-preview.png 1280 640 -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Bricolage; src: url(../../frontend/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2); font-weight: 200 800; }
  @font-face { font-family: Figtree; src: url(../../frontend/node_modules/@fontsource/figtree/files/figtree-latin-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Figtree; src: url(../../frontend/node_modules/@fontsource/figtree/files/figtree-latin-700-normal.woff2); font-weight: 700; }
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; background: #fbf5ec; color: #2b1d14; font-family: Figtree; display: flex; align-items: center; gap: 72px; padding: 0 88px; box-sizing: border-box; overflow: hidden; position: relative; }
  .staff { position: absolute; left: 0; right: 0; top: 548px; height: 50px; background: repeating-linear-gradient(#eadfd0 0 2px, transparent 2px 12px); }
  .left { flex: 1; position: relative; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 104px; height: 104px; }
  h1 { font-family: Bricolage; font-weight: 800; font-size: 84px; letter-spacing: -2px; margin: 0; }
  p { font-size: 33px; line-height: 1.3; margin: 34px 0 36px; color: #6b5647; max-width: 600px; }
  p b { color: #a84a14; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 620px; }
  .chip { font-weight: 700; font-size: 21px; padding: 9px 18px; border-radius: 999px; background: #fff; border: 2px solid #eadfd0; }
  .card { width: 380px; background: #4b2e5a; color: #fbf5ec; border-radius: 24px; padding: 34px 34px 30px; box-shadow: 0 24px 48px -20px rgba(75,46,90,.55); position: relative; }
  .label { font-size: 17px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #e7daec; }
  .name { font-family: Bricolage; font-weight: 700; font-size: 32px; margin: 8px 0 22px; }
  .beats { display: grid; grid-template-columns: repeat(5, 34px); gap: 16px 18px; }
  .beat { width: 34px; height: 34px; border-radius: 50%; background: #ef852e; }
  .beat.todo { background: transparent; box-shadow: inset 0 0 0 4px #ef852e; }
  .left-num { display: flex; align-items: baseline; gap: 12px; margin-top: 26px; }
  .left-num b { font-family: Bricolage; font-size: 64px; font-weight: 800; color: #f5a66a; line-height: 1; }
  .left-num span { font-size: 22px; color: #e7daec; }
  .low { position: absolute; top: 30px; right: 30px; background: #fde6d2; color: #a84a14; font-weight: 700; font-size: 16px; padding: 6px 14px; border-radius: 999px; }
</style>

</div>

    <i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat todo"></i><i class="beat todo"></i>
  </div>
  <div class="left-num"><b>2</b><span>lessons left</span></div>
</div>
