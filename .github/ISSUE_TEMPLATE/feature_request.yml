name: Feature request
description: Suggest something a teacher, a studio or a parent needs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it and what they do today without this feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would solve it. Alternatives you considered are welcome.
    validations:
      required: true
