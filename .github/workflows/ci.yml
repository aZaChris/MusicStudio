# Quality gate (Constitution VII). A red run must block merge: enable branch protection
# on the default branch with "ci / backend" as a required status check.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: musicstudio
          POSTGRES_USER: musicstudio
          POSTGRES_PASSWORD: musicstudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U musicstudio"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://musicstudio:musicstudio@localhost:5432/musicstudio
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Migrations in sync
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Tests + coverage (fails under 90%)
        run: uv run pytest --cov-report=xml

      - name: Production settings pass Django's deploy checks (OWASP API8)
        # Dummy values: only the settings are checked, nothing connects anywhere.
        run: |
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export JWT_SIGNING_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export FIELD_ENCRYPTION_KEYS="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
        env:
          DJANGO_ALLOWED_HOSTS: api.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://api.example.com
          SMTP_HOST: smtp.example.com
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          DEFAULT_FROM_EMAIL: ci@example.com
          FRONTEND_URL: https://app.example.com

      - name: OpenAPI contract is committed and up to date
        run: |
          uv run python manage.py spectacular --settings=config.settings.test --fail-on-warn --file /tmp/schema.yml
          diff -u openapi.yaml /tmp/schema.yml

  secrets:
    # Secret scanning over the whole history (constitution X): a key committed once stays in
    # git forever, so the build fails as soon as one appears. Pinned version and checksum:
    # the scanner itself must not be a supply-chain hole.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: Scan the history
        run: ./gitleaks git --redact --config .gitleaks.toml --verbose

  frontend:
    # The React portal (constitution 3.0.0, Principle VI-VII).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (0 warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

      - name: API types match backend/openapi.yaml
        run: npm run api:check

  web-image:
    # Builds and runs the production image to prove what the Coolify deploy relies on:
    # non-root, SPA route fallback, security headers, health endpoint, fail-fast config.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: >
          docker build frontend --target prod -t musicstudio-web
          --build-arg VITE_API_BASE_URL=https://api.example.com/api/v1

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id musicstudio-web -u)" != "0"

      - name: Refuses to start without API_ORIGIN
        run: "! docker run --rm musicstudio-web"

      - name: Serves routes, health and security headers
        run: |
          docker run -d --name web -e API_ORIGIN=https://api.example.com -p 127.0.0.1:18080:8080 musicstudio-web
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS -D headers.txt -o page.html http://127.0.0.1:18080/students/42
          cat headers.txt
          grep -q '<div id="root">' page.html
          grep -qi "content-security-policy:.*connect-src 'self' https://api.example.com" headers.txt
          grep -qi "content-security-policy:.*frame-ancestors 'none'" headers.txt
          grep -qi "x-content-type-options: nosniff" headers.txt
          grep -qi "referrer-policy: strict-origin-when-cross-origin" headers.txt
          grep -qi "permissions-policy:" headers.txt
          ! grep -qi "^server: nginx/" headers.txt
          docker rm -f web
