# Weekly updates. Minor and patch versions arrive grouped, one PR per ecosystem; every major
# version gets its own PR, so a breaking change is reviewed alone and a red CI names its cause.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
    # Django stays on the 5.2 LTS (security patches until April 2028, audit-iniziale.md); the
    # move to the next LTS is planned as its own phase, not a weekly bump. Patches still arrive.
    ignore:
      - dependency-name: django
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }
      # react-i18next's majors need the matching i18next major: one PR, or neither installs.
      # Dependabot takes the first matching group, so only majors reach this one.
      i18n: { patterns: ["i18next", "i18next-*", "react-i18next"] }
    # @types/node follows the Node version we run (CI and the image use Node 22), not npm's latest.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
