services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file: .env
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  celery-worker:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file: .env
    volumes:
      - ../backend:/app
    depends_on:
      - backend
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file: .env
    volumes:
      - ../backend:/app
    depends_on:
      - backend
    command: celery -A config beat -l info

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
      target: dev
    env_file: .env
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  db-data:
